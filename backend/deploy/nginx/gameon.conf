# ==============================================================================
# Host Nginx Configuration for GAMEON TELE
# Domain: innopulseplatform.com
# Upstreams: 127.0.0.1:8200 (API & Admin)
# ==============================================================================

upstream gameon_backend {
    server 127.0.0.1:8200;
    keepalive 32;
}

# 1. API Subdomain: gameon-api.innopulseplatform.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name gameon-api.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;

    location / {
        proxy_pass http://gameon_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# 2. Admin Subdomain: gameon-admin.innopulseplatform.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name gameon-admin.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;

    location / {
        proxy_pass http://gameon_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gameon_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
