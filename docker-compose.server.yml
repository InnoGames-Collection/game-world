# ==============================================================================
# GAMEON TELE — Complete Production Stack (Frontend + Backend + Dedicated Admin + DB + Cache)
# Target: GCP Compute Engine VM (innoserver-serv001: 34.41.116.217)
# Port Block:
#   - 3300: gameon-web (Customer Gaming Portal)
#   - 3302: gameon-api (Player Fastify API)
#   - 3303: gameon-admin (Dedicated Admin & Auditor Operations Console)
#   - 5434: gameon-postgres (PostgreSQL 16)
#   - 6384: gameon-valkey (Valkey 8)
# ==============================================================================

services:
  # ── PostgreSQL 16 Enterprise Relational Store ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gameon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameon}
      POSTGRES_USER: ${POSTGRES_USER:-gameon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameon_secure_prod_password_2026}
    volumes:
      - gameon_pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameon_app} -d ${POSTGRES_DB:-gameon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Valkey 8.x Distributed High-Performance Cache ───────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: gameon-valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6384:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Player & Game Center Fastify API ────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gameon-api
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment:
      NODE_ENV: production
      PORT: 3302
      HOST: 0.0.0.0
      DOMAIN: innopulseplatform.com
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gameon_app}:${POSTGRES_PASSWORD:-gameon_secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-gameon}?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379"
      JWT_SECRET: ${JWT_SECRET:-gameon-tele-super-secret-jwt-key-prod-2026}
      GAME_TOKEN_SECRET: ${GAME_TOKEN_SECRET:-gameon-tele-anti-cheat-round-token-secret-prod-2026}
      CRON_SECRET: ${CRON_SECRET:-gameon-cron-secret-prod-2026}
      RATE_LIMIT_GENERAL: 60
      TELEBIRR_MODE: ${TELEBIRR_MODE:-live}
      TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY:-}
      TELEBIRR_APP_ID: ${TELEBIRR_APP_ID:-}
      TELEBIRR_CHECKOUT_URL: ${TELEBIRR_CHECKOUT_URL:-https://telebirr.et/checkout}
      TELEBIRR_NOTIFY_URL: ${TELEBIRR_NOTIFY_URL:-https://gameon-api.innopulseplatform.com/api/webhooks/telebirr/callback}
      TELEBIRR_RETURN_URL: ${TELEBIRR_RETURN_URL:-https://gameon.innopulseplatform.com/#/profile}
    ports:
      - "127.0.0.1:3302:3302"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3302/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Dedicated Admin & Telecom Auditor Operations Console ────────────────────
  admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gameon-admin
    restart: unless-stopped
    command: ["node", "dist/admin/adminServer.js"]
    environment:
      NODE_ENV: production
      PORT: 3303
      ADMIN_PORT: 3303
      HOST: 0.0.0.0
      DOMAIN: innopulseplatform.com
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gameon_app}:${POSTGRES_PASSWORD:-gameon_secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-gameon}?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379"
      JWT_SECRET: ${JWT_SECRET:-gameon-tele-super-secret-jwt-key-prod-2026}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET:-goplay-tele-admin-magic-link-secret-2026}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-innospher@gmail.com}
      BREVO_SENDER_NAME: "GoPlay Operations Console"
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL:-https://gameon-admin.innopulseplatform.com}
    ports:
      - "127.0.0.1:3303:3303"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3303/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Public Web Portal (React 19 / Catalog Games) ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gameon-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3300
    ports:
      - "127.0.0.1:3300:3300"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3300/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  gameon_pgdata:
